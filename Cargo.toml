[workspace]
resolver = "2"
members = [
    "crates/tt-core",
    "crates/tt-common",
    "crates/tt-config",
    "crates/tt-auth",
    "crates/tt-messaging",
    "crates/tt-git",
    "crates/tt-search",
    "crates/tt-storage",
    "crates/tt-realtime",
    "crates/tt-agents",
    "crates/tt-secrets",
    "crates/tt-kms",
    "crates/tt-billing",
    "crates/tt-audit",
    "crates/tt-pipelines",
    "crates/tt-notifications",
    "crates/tt-api",
    "crates/tt-server"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Turing Tarpit"]
license = "Proprietary"
publish = false

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-web = "0.12"
prost-types = "0.13"

# Auth
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
pasetors = { version = "0.7", features = ["std", "v4", "paserk"] }
argon2 = "0.5"

# IDs & time
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Git
gix = { version = "0.70", default-features = false, features = ["max-performance-safe"] }

# Search
meilisearch-sdk = "0.27"

# HTTP / utilities
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
bytes = "1"
http = "1"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Internal crates (path dependencies will be set per-crate)
tt-core = { path = "crates/tt-core" }
tt-common = { path = "crates/tt-common" }
tt-config = { path = "crates/tt-config" }
tt-auth = { path = "crates/tt-auth" }
tt-messaging = { path = "crates/tt-messaging" }
tt-git = { path = "crates/tt-git" }
tt-search = { path = "crates/tt-search" }
tt-storage = { path = "crates/tt-storage" }
tt-compute = { path = "crates/tt-compute" }
tt-net = { path = "crates/tt-net" }
tt-realtime = { path = "crates/tt-realtime" }
tt-agents = { path = "crates/tt-agents" }
tt-secrets = { path = "crates/tt-secrets" }
tt-kms = { path = "crates/tt-kms" }
tt-billing = { path = "crates/tt-billing" }
tt-audit = { path = "crates/tt-audit" }
tt-pipelines = { path = "crates/tt-pipelines" }
tt-notifications = { path = "crates/tt-notifications" }
tt-api = { path = "crates/tt-api" }

[profile.release]
lto = true
codegen-units = 1
strip = true

