services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turing
      POSTGRES_PASSWORD: turing
      POSTGRES_DB: turing_tarpit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turing -d turing_tarpit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: turing-dev-master-key-change-me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data

  # Optional in early development
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24
  #   ports:
  #     - "8123:8123"
  #     - "9009:9000"
  #   volumes:
  #     - clickhouse-data:/var/lib/clickhouse

  # S3-compatible object storage (MinIO for now; swap to RustFS later)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: turing
      MINIO_ROOT_PASSWORD: turingsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # create default bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 turing turingsecret;
      mc mb --ignore-existing local/turing-tarpit;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  minio-data:
  # clickhouse-data:

