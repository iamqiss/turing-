syntax = "proto3";

package turing.tarpit.auth.v1;

import "common/v1.proto";

service AuthService {
  // WebAuthn registration ceremony
  rpc BeginRegistration(BeginRegistrationRequest) returns (BeginRegistrationResponse);
  rpc FinishRegistration(FinishRegistrationRequest) returns (FinishRegistrationResponse);

  // WebAuthn authentication ceremony
  rpc BeginAuthentication(BeginAuthenticationRequest) returns (BeginAuthenticationResponse);
  rpc FinishAuthentication(FinishAuthenticationRequest) returns (FinishAuthenticationResponse);

  // Session management
  rpc GetCurrentPrincipal(GetCurrentPrincipalRequest) returns (GetCurrentPrincipalResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Agent tokens
  rpc CreateAgentToken(CreateAgentTokenRequest) returns (CreateAgentTokenResponse);
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse);
}

message BeginRegistrationRequest {
  string display_name = 1;
  string handle = 2;
  string email = 3;
}

message BeginRegistrationResponse {
  // opaque WebAuthn options JSON
  string public_key_credential_creation_options = 1;
}

message FinishRegistrationRequest {
  string public_key_credential = 1; // JSON from navigator.credentials.create
}

message FinishRegistrationResponse {
  common.v1.Id principal_id = 1;
  string session_token = 2;
}

message BeginAuthenticationRequest {
  string handle = 1; // or email
}

message BeginAuthenticationResponse {
  string public_key_credential_request_options = 1;
}

message FinishAuthenticationRequest {
  string public_key_credential = 1;
}

message FinishAuthenticationResponse {
  common.v1.Id principal_id = 1;
  string session_token = 2;
}

message GetCurrentPrincipalRequest {}

message GetCurrentPrincipalResponse {
  Principal principal = 1;
}

message LogoutRequest {}
message LogoutResponse {}

message CreateAgentTokenRequest {
  common.v1.Id agent_id = 1;
  string name = 2;
  repeated string scopes = 3;
}

message CreateAgentTokenResponse {
  string token = 1; // shown once
  common.v1.Id token_id = 2;
}

message RevokeAgentTokenRequest {
  common.v1.Id token_id = 1;
}

message RevokeAgentTokenResponse {}

message Principal {
  common.v1.Id id = 1;
  string kind = 2; // "human" | "agent"
  string display_name = 3;
  string handle = 4;
  optional string avatar_url = 5;
  optional string email = 6;
  optional common.v1.Id owner_id = 7;
}
